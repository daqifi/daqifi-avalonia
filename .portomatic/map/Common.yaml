- downstream: Daqifi.Avalonia/Daqifi.Desktop.Common/AppVersion.cs
  rationale: >
    Downstream-only version resolver; no upstream Daqifi.Desktop.Common counterpart. Pairs with
    the Daqifi.Desktop.Common.AppVersion downstream_only symbol entry above.
  notes: null
  added_at: '2026-08-31'
