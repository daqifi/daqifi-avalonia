divergences:
- id: DIV-UI-001
  upstream_path: null
  downstream_path: null
  upstream_symbol: FirewallManager
  downstream_symbol: null
  kind: dropped
  rationale: 'Windows firewall rule management (HNetCfg.FwPolicy2 COM) is a Windows-only
    concept; other platforms have no equivalent app-managed firewall surface. Feature
    is conditionally compiled / service-gated to Windows.

    '
  accepted_at: '2026-07-06'
- id: DIV-UI-002
  upstream_path: null
  downstream_path: null
  upstream_symbol: AdminChecker
  downstream_symbol: null
  kind: dropped
  rationale: 'WindowsIdentity/WindowsPrincipal elevation checks exist to support the
    firewall feature (DIV-UI-001); dropped with it on non-Windows.

    '
  accepted_at: '2026-07-06'
- id: DIV-UI-003
  upstream_path: null
  downstream_path: null
  upstream_symbol: SerialStreamingDevice
  downstream_symbol: null
  kind: behavioral
  rationale: "System.IO.Ports does not exist on iOS and is unusable as-is on Android\
    \ \u2014 mobile is WiFi/TCP + UDP discovery ONLY. Desktop keeps serial. First-class\
    \ recorded divergence, not a coverage gap (full-capability-parity rule).\n"
  accepted_at: '2026-07-06'
- id: DIV-UI-004
  upstream_path: null
  downstream_path: null
  upstream_symbol: FirmwareUpdateService
  downstream_symbol: null
  kind: behavioral
  rationale: "Firmware update rides the HID bootloader transport (Daqifi.Core), which\
    \ has no mobile story \u2014 desktop-only. Mobile builds hide the feature.\n"
  accepted_at: '2026-07-06'
- id: DIV-UI-005
  upstream_path: null
  downstream_path: null
  upstream_symbol: DaqifiDesktopInstaller
  downstream_symbol: null
  kind: split
  rationale: 'WiX MSI packaging splits into per-platform packaging concepts (MSIX/MSI,
    dmg, AppImage-or-deb, apk/aab, ipa). Catalogued as concepts; implementation belongs
    to the port, not the engine.

    '
  accepted_at: '2026-07-06'
