divergences:
- id: DIV-UI-001
  upstream_path: null
  downstream_path: null
  upstream_symbol: FirewallManager
  downstream_symbol: null
  kind: dropped
  rationale: 'Windows firewall rule management (HNetCfg.FwPolicy2 COM) is a Windows-only
    concept; other platforms have no equivalent app-managed firewall surface. Feature
    is conditionally compiled / service-gated to Windows.

    '
  accepted_at: '2026-07-06'
- id: DIV-UI-002
  upstream_path: null
  downstream_path: null
  upstream_symbol: AdminChecker
  downstream_symbol: null
  kind: dropped
  rationale: 'WindowsIdentity/WindowsPrincipal elevation checks exist to support the
    firewall feature (DIV-UI-001); dropped with it on non-Windows.

    '
  accepted_at: '2026-07-06'
- id: DIV-UI-003
  upstream_path: null
  downstream_path: null
  upstream_symbol: SerialStreamingDevice
  downstream_symbol: null
  kind: behavioral
  rationale: "System.IO.Ports does not exist on iOS and is unusable as-is on Android\
    \ \u2014 mobile is WiFi/TCP + UDP discovery ONLY. Desktop keeps serial. First-class\
    \ recorded divergence, not a coverage gap (full-capability-parity rule).\n"
  accepted_at: '2026-07-06'
- id: DIV-UI-004
  upstream_path: null
  downstream_path: null
  upstream_symbol: FirmwareUpdateService
  downstream_symbol: null
  kind: behavioral
  rationale: "Firmware update rides the HID bootloader transport (Daqifi.Core), which\
    \ has no mobile story \u2014 desktop-only. Mobile builds hide the feature.\n"
  accepted_at: '2026-07-06'
- id: DIV-UI-005
  upstream_path: null
  downstream_path: null
  upstream_symbol: DaqifiDesktopInstaller
  downstream_symbol: null
  kind: split
  rationale: 'WiX MSI packaging splits into per-platform packaging concepts (MSIX/MSI,
    dmg, AppImage-or-deb, apk/aab, ipa). Catalogued as concepts; implementation belongs
    to the port, not the engine.

    '
  accepted_at: '2026-07-06'
- id: DIV-001
  upstream_path: null
  downstream_path: null
  upstream_symbol: Daqifi.Desktop.Services.WpfMessageBoxService
  downstream_symbol: Daqifi.Desktop.Services.AvaloniaMessageBoxService
  kind: ambiguous_match
  rationale: token match tie (divergent) score 0.60
  accepted_at: '2026-07-13'
- id: DIV-002
  upstream_path: null
  downstream_path: null
  upstream_symbol: Daqifi.Desktop.Services.WpfMessageBoxService
  downstream_symbol: Daqifi.Desktop.Services.IMessageBoxService
  kind: ambiguous_match
  rationale: token match tie (divergent) score 0.60
  accepted_at: '2026-07-13'
- id: DIV-DS-001
  upstream_path: Daqifi.Desktop/ViewModels/ConnectionDialogViewModel.cs
  downstream_path: Daqifi.Avalonia/Daqifi.Desktop/ViewModels/ConnectionDialogViewModel.cs
  upstream_symbol: Daqifi.Desktop.ViewModels.ConnectionDialogViewModel
  downstream_symbol: Daqifi.Desktop.ViewModels.ConnectionDialogViewModel
  kind: behavioral
  rationale: 'Bench-QA hardening beyond upstream: a 10s serial-sweep watchdog and
    a bounded stop-path sweep drain survive wedged COM ports on Daqifi.Core 1.0.0
    (commits ccdc0b6/a927fa0/350c507). The off-UI-thread Task.Run discovery AND the
    generation-lifetime guard (ContinueWith clears the tracked task only on true completion;
    async stops leave it set and skip finder/CTS disposal on timeout) are upstream
    parity as of c4c63fa (#689, reconciled at the 2026-07-14 sync). Remove the watchdog+drain
    once the app consumes a Core release containing daqifi-core#295.

    '
  accepted_at: '2026-07-13'
- id: DIV-DS-002
  upstream_path: Daqifi.Desktop/Loggers/PlotLogger.cs
  downstream_path: Daqifi.Avalonia/Daqifi.Desktop/Loggers/PlotLogger.cs
  upstream_symbol: Daqifi.Desktop.Loggers.PlotLogger
  downstream_symbol: Daqifi.Desktop.Loggers.PlotLogger
  kind: behavioral
  rationale: "Render timer runs at DispatcherPriority.Normal, not Render (commit a927fa0)\
    \ \u2014 Avalonia renders on demand and a below-Normal timer risks never pumping\
    \ on a static UI; WPF's composition loop has no such hazard. Temporary plot-tick\
    \ QA breadcrumbs also live here until plotting is trusted (remove-when noted in-file).\n"
  accepted_at: '2026-07-13'
- id: DIV-DS-004
  upstream_path: Daqifi.Desktop/View/DeviceLogsView.xaml
  downstream_path: Daqifi.Avalonia/Daqifi.Desktop/View/DeviceLogsView.axaml
  upstream_symbol: null
  downstream_symbol: null
  kind: api_shape
  rationale: "Per-row SD IMPORT button binds Command via $parent[DataGrid].DataContext\
    \ (commit 5d42863) \u2014 Avalonia ElementName bindings cannot cross the DataGrid\
    \ cell-template name scope, so upstream's ElementName=DeviceFilesList form is\
    \ silently dead. Same name-scope rule ProfilesPane hit; catalog idiom.\n"
  accepted_at: '2026-07-13'
