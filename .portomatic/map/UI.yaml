mechanisms:
- name: dialog_service
  concepts:
  - dialog_routing
  - message_box
  - file_pickers
  invariant: "EVERY dialog \u2014 view-model dialogs, message boxes, and picker wrappers\
    \ \u2014 goes through the ONE DialogService map. Do not instantiate dialog windows\
    \ per call site; a porter adding a second dialog path breaks ownership, theming,\
    \ and testability (the FlaUI/headless suites drive dialogs through the service)."
  resource: "single DialogService VM-type\u2192window-type map"
  notes: null
- name: flyout_host
  concepts:
  - flyout_host
  - main_window_chrome
  invariant: "The three MahApps flyouts become pane content of ONE SplitView host\
    \ owned by the main window \u2014 not three independent slide-out implementations."
  resource: single SplitView flyout host in the main window
  notes: null
- name: charting_stack
  concepts:
  - chart_plot_host
  - chart_minimap_interaction
  - chart_dark_theme
  invariant: One charting stack serves every pane. The PlotModel-building code is
    shared and portable; do not split panes onto different chart libraries or duplicate
    model-construction logic per pane.
  resource: one OxyPlot model layer feeding live graph, logged-data pane, and minimap
  notes: null
- name: device_watcher
  concepts:
  - usb_hotplug_watch
  invariant: "Exactly one IDeviceWatcher instance feeds ConnectionManager; platform\
    \ backends register through it. Mobile backends are no-ops (no serial) \u2014\
    \ the interface must tolerate a backend that never fires."
  resource: one hotplug watcher interface with per-OS backends
  notes: null
- name: axaml_styling_dialect
  concepts:
  - axaml_keyed_styles
  - axaml_data_triggers
  invariant: "Every keyed WPF Style becomes a ControlTheme (template parts via /template/\
    \ selectors) and every DataTrigger becomes a bound style class + class selector.\
    \ There are no triggers in Avalonia \u2014 a port that leaves trigger syntax in\
    \ place compiles nothing or silently loses the visual state; conversions must\
    \ keep per-view visual-state parity."
  resource: Avalonia selector/ControlTheme styling system
  notes: null
- name: axaml_name_scopes
  concepts:
  - axaml_elementname_scope
  invariant: "ElementName bindings cannot cross a DataTemplate or cell-template name-scope\
    \ boundary \u2014 the binding is SILENTLY dead (no error, no output). Inside any\
    \ template, reach outer context via $parent[ContainerType].DataContext. Bit the\
    \ drain twice (ProfilesPane, then the DeviceLogsView SD IMPORT button \u2014 DIV-DS-004)."
  resource: Avalonia per-template name scopes
  notes: null
- name: axaml_binding_fidelity
  concepts:
  - axaml_binding_delay
  invariant: "Never drop an upstream binding feature on an unverified 'Avalonia doesn't\
    \ have it' claim \u2014 verify against current Avalonia docs first. Binding.Delay\
    \ exists since 11.1; a drain agent dropped search debounces on exactly this false\
    \ claim (the one fidelity regression that reached QA)."
  resource: Avalonia binding engine (11.1+)
  notes: null
- name: oxyplot_theme
  concepts:
  - oxyplot_theme_include
  invariant: "The OxyPlot theme StyleInclude in App.axaml is load-bearing for EVERY\
    \ PlotView in the app \u2014 without it plots render nothing, silently (no exception,\
    \ no binding error). New windows hosting a PlotView inherit it from App.axaml;\
    \ do not add per-window includes or remove it during style refactors."
  resource: vendored OxyPlot.Avalonia theme (third_party/oxyplot-avalonia)
  notes: null
- name: axaml_control_substitutions
  concepts:
  - axaml_mouse_bindings
  - axaml_listview_gridview
  - axaml_visibility_events
  - axaml_enum_itemssource
  - axaml_progress_ring
  invariant: "Standard control substitutions must keep capability parity (command\
    \ routing, sorting/selection, event lifecycle, indeterminate state) \u2014 substitute,\
    \ verify the behavior survives, and record a divergence when it intentionally\
    \ differs (full-capability-parity, portomatic#176)."
  resource: Avalonia control set
  notes: null
