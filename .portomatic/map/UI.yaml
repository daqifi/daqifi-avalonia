mechanisms:
- concepts:
  - dialog_routing
  - message_box
  - file_pickers
  invariant: EVERY dialog — view-model dialogs, message boxes, and picker wrappers
    — goes through the ONE DialogService map. Do not instantiate dialog windows per
    call site; a porter adding a second dialog path breaks ownership, theming, and
    testability (the FlaUI/headless suites drive dialogs through the service).
  name: dialog_service
  notes: null
  resource: single DialogService VM-type→window-type map
- concepts:
  - flyout_host
  - main_window_chrome
  invariant: The three MahApps flyouts become pane content of ONE SplitView host owned
    by the main window — not three independent slide-out implementations.
  name: flyout_host
  notes: null
  resource: single SplitView flyout host in the main window
- concepts:
  - chart_plot_host
  - chart_minimap_interaction
  - chart_dark_theme
  invariant: One charting stack serves every pane. The PlotModel-building code is
    shared and portable; do not split panes onto different chart libraries or duplicate
    model-construction logic per pane.
  name: charting_stack
  notes: null
  resource: one OxyPlot model layer feeding live graph, logged-data pane, and minimap
- concepts:
  - usb_hotplug_watch
  invariant: Exactly one IDeviceWatcher instance feeds ConnectionManager; platform
    backends register through it. Mobile backends are no-ops (no serial) — the interface
    must tolerate a backend that never fires.
  name: device_watcher
  notes: null
  resource: one hotplug watcher interface with per-OS backends
