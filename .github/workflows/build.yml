name: Build

# Compile gate for every head, and the thing that finally makes the committed
# packages.lock.json files load-bearing.
#
# GitHub Actions sets CI=true, which is one of the two conditions on
# RestoreLockedMode in the repo-root Directory.Build.props, so restores here run in
# LOCKED mode: a lock file that has drifted from the project's dependencies fails
# with NU1004 instead of being silently regenerated. Before #71 nothing in this repo
# exercised that, and nothing checked that any head still compiled — the Avalonia 12
# migration surfaced two breaks (androidx.lifecycle.runtime forcing minSdk 23, and
# the capture harness needing Avalonia.HarfBuzz once text shaping was decoupled from
# the renderer) that only a build could have found.
#
# tools/parity-audit/WpfCapture is deliberately absent: it targets net10.0-windows
# and ProjectReferences the SIBLING daqifi-desktop repo, so it cannot restore here at
# all. It is also opted out of the lock-file policy — see its csproj.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on a PR branch, but never on main.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # The .github/scripts guards are only worth anything if they still work, and two
  # of them are invoked NOWHERE on a normal PR: check_dependabot_claims.py runs
  # only on Dependabot's own pull requests, and check_core_drift.py only on a
  # weekly schedule. A change that broke either would sit undetected until the next
  # Dependabot PR or the next Monday — and both guards exist precisely because
  # nobody was watching. This job runs every self-test on every push and PR, so a
  # broken guard fails here instead of going quiet where it matters.
  #
  # The other two are ALSO invoked in place, next to the step whose verdict they
  # gate. That duplication is deliberate: this job proves the guard works, the
  # in-place run proves it works on the runner that is about to trust it.
  scripts:
    name: CI script self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run every guard's self-test
        run: |
          set -euo pipefail
          mapfile -t tests < <(find .github/scripts -name 'test_*.py' | sort)
          # A silent empty sweep would report success without running anything —
          # the same failure shape the guards themselves are written to avoid.
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::No .github/scripts/test_*.py found — nothing was run."
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "::group::${test}"
            python3 "${test}"
            echo "::endgroup::"
          done

  desktop:
    name: Library + Desktop head + capture harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Resolve the SDK from global.json, NOT a floating '10.0.x'.
      # Microsoft.NET.ILLink.Tasks is an IMPLICIT PackageReference on the trimming heads,
      # pinned to the SDK's BundledNETCoreAppPackageVersion — its bundled runtime. So the
      # SDK patch silently decides a package version that the lock files record, which
      # makes a floating SDK an input to locked mode that nobody controls. '10.0.x'
      # floated across a whole feature band (to 10.0.400, runtime 10.0.11) and broke
      # restore with NU1004 on a repo nobody had touched in 12 days. See #107.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Fail loudly if the locked-mode gate is NOT actually armed. Without this the
      # whole workflow could go green while restores silently ran unlocked — the
      # failure mode that made the lock files decorative in the first place. Checked
      # against a real project so it reflects the inherited Directory.Build.props.
      - name: Verify locked-mode restore is armed
        run: |
          set -euo pipefail
          locked=$(dotnet msbuild Daqifi.Avalonia/Daqifi.Avalonia.csproj \
            -getProperty:RestoreLockedMode)
          echo "RestoreLockedMode=${locked}"
          if [ "${locked}" != "true" ]; then
            echo "::error::RestoreLockedMode is '${locked}', expected 'true'." \
                 "Lock files are not being enforced — the gate is off."
            exit 1
          fi

      # Restored explicitly (rather than implicitly via build) so an NU1004
      # lock-file drift failure is attributed to its own step.
      - name: Restore
        run: |
          dotnet restore Daqifi.Avalonia/Daqifi.Avalonia.csproj
          dotnet restore Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj
          dotnet restore tools/parity-audit/AvaloniaCapture/AvaloniaCapture.csproj

      # Locked mode fails a restore whose lock file has DRIFTED, but a lock file can also be
      # committed already-wrong in a way that only surfaces as a confusing error later. The
      # specific trap: an explicit `-r <rid>` restore rewrites the lock to hold only that RID
      # (#85), and committing that yields "NU1004: the project's runtime identifiers have
      # changed" on the next run. Asserting the tree is unchanged after restore catches any such
      # mutation at its source and names the file, instead of leaving the next person to decode a
      # RID-mismatch error.
      - name: Lock files must be unchanged by restore
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::restore modified a committed lock file — it was not in the state a" \
                 "clean restore produces. Most often this is a lock file committed from a" \
                 "'-r <rid>' build, which prunes the other RIDs. Re-restore without -r (or with" \
                 "--force-evaluate) and commit that."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by restore"

      # AvaloniaCapture pins RuntimeIdentifier=win-x64; that cross-builds fine on
      # Linux (it just cannot be RUN here), so it is worth compiling as a gate.
      - name: Build
        run: |
          dotnet build Daqifi.Avalonia/Daqifi.Avalonia.csproj \
            -c Release --no-restore
          dotnet build Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj \
            -c Release --no-restore
          dotnet build tools/parity-audit/AvaloniaCapture/AvaloniaCapture.csproj \
            -c Release --no-restore

      - name: Upload dependency graphs
        uses: actions/upload-artifact@v4
        with:
          name: assets-desktop
          path: '**/obj/project.assets.json'
          if-no-files-found: error

      # Everything above only sees drift that a PLAIN restore reacts to, and a plain
      # restore that finds a CONSISTENT lock file leaves it byte-for-byte alone. NuGet
      # compares ids case-insensitively when deciding that, so a lock file spelled
      # differently from what the pinned SDK now writes is "consistent", survives locked
      # mode and the check above, and stays stale indefinitely. That is #106: four files
      # kept the project key `Oxyplot.Avalonia` long after the SDK started writing
      # `oxyplot.avalonia`, and it surfaced only when a contributor ran --force-evaluate
      # by hand and got a diff out of an untouched tree.
      #
      # --force-evaluate re-derives the graph from scratch, so this fails if the committed
      # files are not what a clean derivation produces. It runs LAST and does not replace
      # the restore above, because --force-evaluate also overrides RestoreLockedMode —
      # this is a staleness check, not a substitute for the drift gate.
      - name: Lock files must equal a from-scratch derivation
        run: |
          set -euo pipefail
          dotnet restore Daqifi.Avalonia/Daqifi.Avalonia.csproj --force-evaluate
          dotnet restore Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj --force-evaluate
          dotnet restore tools/parity-audit/AvaloniaCapture/AvaloniaCapture.csproj \
            --force-evaluate
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::a from-scratch restore derives lock files different from the" \
                 "committed ones. They are stale rather than drifted, which is why every" \
                 "other check passed. Regenerate with .github/scripts/refresh_lock_files.sh" \
                 "and commit the result."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files match a from-scratch derivation"

  macos:
    name: Desktop head on macOS
    # #88. macOS was verified once by hand (docs/RUNBOOK-macos-ios.md §1.1, 2026-08-01)
    # and then guarded by nothing, which is how a Windows-shaped path separator —
    # AppDirectory + "\\..." — reached macOS and quietly wrote settings to a file
    # literally NAMED 'DAQiFi\DAQifiConfiguration.xml'. It never threw, and no job in
    # this workflow could have seen it.
    #
    # Be honest about what this job does and does not add over the ubuntu `desktop`
    # job, which already compiles the same sources from the same RID-less restore:
    #
    #   * It builds the Desktop head for an osx-* RID, which nothing did before. A
    #     RID is not a no-op here — it selects a runtime pack, an apphost, and each
    #     package's runtimes/osx-arm64/ assets.
    #   * It asserts those macOS native assets actually landed (see the last step).
    #     That is the part a green compile genuinely does not prove.
    #
    # It does NOT catch the separator bug above, or anything else that is wrong only
    # at runtime; nothing that merely compiles can. What it buys is that the macOS
    # target stops being a claim nobody re-checks, and it gives the runtime checks a
    # place to land when there is something to run.
    #
    # Deliberately NOT covered, so the green tick does not imply more than it means:
    #   * osx-x64. The head declares it; nobody builds or ships it. macos-latest is
    #     Apple silicon, and a second RID would double a 10x-billed job for a target
    #     with no users.
    #   * Running the app, or a test suite. The macOS QA list (RUNBOOK §1.2) is a
    #     human checklist, and #88's "should it run the unit suite" has an awkward
    #     answer: there is no test project in this repo to run. When one exists, it
    #     belongs here.
    #   * tools/parity-audit/AvaloniaCapture. Pinned to win-x64 and already
    #     cross-built by the `desktop` job; compiling a Windows tool on a macOS
    #     runner buys nothing.
    #   * A dependency-graph upload for `avalonia-graph`. That gate reads the
    #     `libraries` section, which comes from a RID-LESS restore and so is
    #     byte-identical to the one `desktop` already uploads. Uploading it would add
    #     a 10x job to that gate's critical path in exchange for no new information —
    #     and, because the download step takes every artifact in the run rather than
    #     a named list, an upload without a matching `needs:` entry would be a race.
    #
    # macos-latest, matching the ios job, because this repo pins no macOS image.
    # Unlike that job nothing here depends on which one arrives: the Desktop head is
    # plain net10.0, so there is no workload to install and no Xcode to select.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as every other job — see the comment on the desktop job, and #107.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # No -r, for the reason the ios job gives at length and Directory.Build.props
      # gives at more: an explicit-RID restore REWRITES the lock file to hold only
      # that RID (#85), and this head declares four. The RID arrives at BUILD time
      # instead, against the per-RID assets a RID-less restore has already produced
      # for every declared RuntimeIdentifier.
      #
      # The head alone is enough to restore — Daqifi.Avalonia and the vendored
      # OxyPlot.Avalonia arrive as project references.
      - name: Restore
        run: dotnet restore Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj

      # Same guard as every other job.
      - name: Lock files must be unchanged by restore
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::restore modified a committed lock file — it was not in the state a" \
                 "clean restore produces. Most often this is a lock file committed from a" \
                 "'-r <rid>' build, which prunes the other RIDs. Re-restore without that flag" \
                 "(or force-evaluate) and commit the result."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by restore"

      # --no-restore is load-bearing, not a speed-up — the same point the ios job
      # makes. It is what keeps the -r above out of restore, and therefore out of the
      # lock file.
      - name: Build
        run: |
          dotnet build Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj \
            -c Release -r osx-arm64 --no-restore

      # The second look the ios job also takes, and for the same reason: this is one
      # of only two jobs that pass -r at all, the post-restore check cannot see a lock
      # file rewritten by the BUILD, and --no-restore above is precisely a claim about
      # the build's effect on that file.
      - name: Lock files must be unchanged by the RID build
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::the -r build rewrote a lock file, which means it restored" \
                 "despite --no-restore. Whatever caused that, do not commit the result:" \
                 "a RID-pruned lock file fails the next run with NU1004."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by the RID build"

      # Verify the ARTIFACT, not the exit code — the standing rule in
      # docs/RUNBOOK-macos-ios.md, and the same shape as the ios job's Assets.car
      # check. This is the part of the job a green compile does not already cover.
      #
      # Every library below ships inside a NuGet package as a runtimes/osx-arm64/
      # native/ entry, and `-r osx-arm64` is what makes the SDK select that RID's
      # copy and place it next to the binary. If a bump ever dropped or renamed one,
      # the managed compile would still succeed — on ubuntu AND here — and the app
      # would die on first use with a DllNotFoundException that names a file nobody
      # put in a csproj. Each of these is fatal on its own:
      #
      #   libAvaloniaNative          the macOS windowing backend; no window without it
      #   libSkiaSharp               the renderer
      #   libHarfBuzzSharp           text shaping, decoupled from the renderer in
      #                              Avalonia 12 (see this file's header)
      #   libSystem.IO.Ports.Native  serial/USB — the entire point of the app
      #   libe_sqlite3               the logging database
      #
      # Presence alone is not enough for any of them: a package that shipped an
      # x86_64-only binary under runtimes/osx-arm64/ would satisfy an existence test
      # and still not load in an arm64 process. So each one is read for an arm64
      # slice, exactly as the apphost is.
      - name: macOS output must be an arm64 binary carrying its native dependencies
        run: |
          set -euo pipefail
          out=Daqifi.Avalonia.Desktop/bin/Release/net10.0/osx-arm64

          # `file -b`, and only its FIRST line. Neither is tidiness. The output
          # directory is literally named 'osx-arm64' and plain `file` prefixes every
          # line it prints with the path, so the string "arm64" is in that output no
          # matter what the binary actually is:
          #
          #   * For a THIN file the path prefix lands BEFORE the word "Mach-O", so a
          #     *Mach-O*arm64* test still rejects an x86_64 binary — by luck of
          #     ordering, not by design.
          #   * For a UNIVERSAL file `file` appends one line per architecture, each
          #     repeating the path AFTER that header. Now the pattern matches the
          #     DIRECTORY NAME rather than the architecture list, and an x86_64+i386
          #     fat binary would sail through. Three of the five libraries below are
          #     universal today, so that is not the corner case; it is the usual one.
          #
          # -b drops the prefix from the header line, and the header alone names every
          # architecture in a fat file ("...2 architectures: [x86_64:...] [arm64]") —
          # sufficient, and free of the path. A universal binary passing is correct
          # rather than a loophole: an arm64 slice is an arm64 slice.
          #
          # awk 'NR == 1' rather than `head -1`: head exits immediately, file takes
          # EPIPE on its next write and aborts with 134, which pipefail turns into a
          # failed job. The ios job hit that exact race with xcodebuild; awk reads to
          # EOF and drains the pipe.
          arch_of() {
            file -b "$1" | awk 'NR == 1'
          }

          host="${out}/Daqifi.Avalonia.Desktop"
          if [ ! -x "${host}" ]; then
            echo "::error::no executable at ${host}. The build output moved; this check" \
                 "needs updating, and the macOS binary is unverified."
            ls -la "${out}" || ls -la Daqifi.Avalonia.Desktop/bin/Release || true
            exit 1
          fi
          host_kind=$(arch_of "${host}")
          echo "apphost: ${host_kind}"
          # Both substrings: a non-Mach-O file and an x86_64 one each fail to match.
          case "${host_kind}" in
            *Mach-O*arm64*) ;;
            *)
              echo "::error::${host} is not an arm64 Mach-O binary: ${host_kind}." \
                   "The -r osx-arm64 build did not produce an Apple-silicon apphost."
              exit 1
              ;;
          esac

          bad=0
          for lib in libAvaloniaNative libSkiaSharp libHarfBuzzSharp \
                     libSystem.IO.Ports.Native libe_sqlite3; do
            path="${out}/${lib}.dylib"
            if [ ! -f "${path}" ]; then
              echo "::error::${lib}.dylib is missing from ${out}. The osx-arm64 runtime" \
                   "asset for it did not resolve, so the app would fail at startup with" \
                   "a DllNotFoundException. Check whether the package that ships it still" \
                   "carries a runtimes/osx-arm64/native/ entry."
              bad=1
              continue
            fi
            lib_kind=$(arch_of "${path}")
            echo "${lib}.dylib: ${lib_kind}"
            case "${lib_kind}" in
              *Mach-O*arm64*) ;;
              *)
                echo "::error::${path} has no arm64 slice: ${lib_kind}. The file is" \
                     "there but cannot load in an arm64 process, so the app fails at" \
                     "startup anyway. A universal binary is fine; an x86_64-only one" \
                     "under runtimes/osx-arm64/ is a packaging regression upstream."
                bad=1
                ;;
            esac
          done
          if [ "${bad}" -ne 0 ]; then
            ls -la "${out}"
            exit 1
          fi
          echo "arm64 apphost and all five macOS natives present, each with an arm64 slice"

  android:
    name: Android head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as the desktop job — see the comment there, and #107. This job is where
      # the drift actually bit: the Android head trims, so it carries the implicit
      # Microsoft.NET.ILLink.Tasks reference whose version the SDK's bundled runtime picks.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Not preinstalled with the SDK; the Android SDK itself ships on the runner
      # image and is pointed at by ANDROID_HOME.
      - name: Install the android workload
        run: dotnet workload install android

      # ANDROID_HOME comes from the runner image, not from anything this repo controls, so
      # assert it before use. Unset or stale, the restore instead fails deep in the Android
      # targets with an XA5300-style "SDK not found" message that reads like a project
      # problem rather than an environment one.
      - name: Verify the Android SDK is present
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on this runner image."
            exit 1
          fi
          if [ ! -d "${ANDROID_HOME}/platforms" ]; then
            echo "::error::ANDROID_HOME='${ANDROID_HOME}' has no platforms/ directory;" \
                 "it does not look like an Android SDK."
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Restore
        run: |
          dotnet restore Daqifi.Avalonia.Android/Daqifi.Avalonia.Android.csproj \
            -p:AndroidSdkDirectory="$ANDROID_HOME"

      # Same guard as the desktop job — the Android head restores its own graph and can
      # mutate its own lock file, so checking only one job would leave half the repo
      # unguarded.
      - name: Lock files must be unchanged by restore
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::restore modified a committed lock file — it was not in the state a" \
                 "clean restore produces. Most often this is a lock file committed from a" \
                 "'-r <rid>' build, which prunes the other RIDs. Re-restore without that flag" \
                 "(or force-evaluate) and commit the result."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by restore"

      - name: Build
        run: |
          dotnet build Daqifi.Avalonia.Android/Daqifi.Avalonia.Android.csproj \
            -c Release --no-restore -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Upload dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: assets-android
          # Same glob as the desktop job, not the single concrete path: for one
          # file upload-artifact strips the tree to its least common ancestor, so
          # the concrete path would arrive as a bare project.assets.json with no
          # project to attribute a failure to.
          path: '**/obj/project.assets.json'
          if-no-files-found: error

  ios:
    name: iOS head
    # The only job here that is not ubuntu, and it has no choice: iOS cannot
    # cross-compile from Linux. Until this existed the iOS head was in
    # Daqifi.Avalonia.slnx and in nobody's build — a change that broke it landed green
    # (#105).
    #
    # This repo is private, so macOS minutes bill at 10x Linux. That is the cost of the
    # job and it is deliberate: the alternative on offer was a path filter, and a gate
    # that only runs when someone remembers to touch the right directory is not a gate.
    # If the bill ever argues otherwise, narrow it on evidence, not on the assumption
    # that shared-library changes cannot break a platform head — that assumption is
    # exactly what #88 records going wrong on macOS.
    #
    # 'latest' rather than a pinned image, unlike everything else in this repo, because
    # the thing that actually has to line up is the image's Xcode MAJOR against the one
    # the pinned SDK's workload wants, and a stale pin does not help with that — an
    # image carries only one Xcode major. When the label moves and the majors diverge,
    # the Xcode step below says so by name instead of failing 200 lines into a build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as the other two jobs — see the comment on the desktop job, and #107.
      # It matters more here than anywhere: the SDK band also decides which iOS workload
      # is installed below, and therefore which Xcode this job has to select.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Mirrors the android job's workload step. Not preinstalled with the SDK, and
      # setup-dotnet installs into its own prefix, so whatever the runner image ships
      # under /usr/local/share/dotnet is not what runs here.
      - name: Install the iOS workload
        run: |
          set -euo pipefail
          dotnet workload install ios 2>&1 | tee "${RUNNER_TEMP}/workload-install.log"
          # This command has been seen to print a permissions error and STILL EXIT 0
          # (docs/RUNBOOK-macos-ios.md §0, caught on a real Mac). The build then fails
          # much later with something that reads like a project problem. Name it here.
          if grep -qi 'inadequate permissions' "${RUNNER_TEMP}/workload-install.log"; then
            echo "::error::'dotnet workload install ios' reported inadequate permissions" \
                 "and exited 0 anyway. The workload is NOT installed. dotnet lives at" \
                 "$(command -v dotnet) on this runner; if that prefix is root-owned the" \
                 "install needs elevation."
            exit 1
          fi

      # Verify the ARTIFACT, not the exit code — the standing rule in
      # docs/RUNBOOK-macos-ios.md, and the specific trap the step above exists for. The
      # android job asserts its SDK is present the same way before using it.
      - name: Verify the iOS workload is installed
        run: |
          set -euo pipefail
          dotnet workload list
          if ! dotnet workload list | awk '$1 == "ios" { found = 1 } END { exit !found }'; then
            echo "::error::'dotnet workload list' does not list 'ios'. The workload" \
                 "install did not take, whatever it exited with."
            exit 1
          fi
          echo "iOS workload present"

      # Run the selector's own tests before trusting it, exactly as avalonia-graph does
      # with its guard. Its value is in REFUSING when the image has no matching Xcode;
      # a selector that only ever succeeds would silently pick the wrong one.
      - name: Self-test the Xcode selector
        run: python3 .github/scripts/test_select_xcode.py

      # #103. .NET for iOS compares the host Xcode for EXACT major.minor equality, so a
      # newer Xcode fails just like an older one and upgrading is not a fix. The two ways
      # out are -p:ValidateXcodeVersion=false, which switches off a real compatibility
      # gate inside the job whose whole purpose is to be one, or selecting the Xcode the
      # workload asks for. The macOS image carries every minor of its Xcode major
      # (26.0.1 … 26.6 today), so the second is a one-line xcode-select.
      #
      # The version is READ FROM THE SDK, never written here, because it tracks the SDK
      # pin and tracks nothing else you could infer it from. Under 10.0.203 the answer was
      # Xcode 26.4; under the pinned 10.0.302 the iOS workload manifest is 26.5.10315 and
      # the Xcode it asks for is 26.6. Those two disagree on purpose — the manifest's 26.5
      # is an iOS version, and the lock file's net10.0-ios26.5 framework is that same
      # number, not an Xcode one. So every literal that looked plausible while writing
      # this (#103's 26.4, the manifest's 26.5, the lock file's 26.5) is wrong. Ask the
      # SDK; it is the only thing that knows.
      - name: Pin Xcode to the version the iOS workload requires
        run: |
          set -euo pipefail
          # _RecommendedXcodeVersion is SDK-internal (hence the underscore) but it is the
          # property _ValidateXcodeVersion itself compares against, so it is the only
          # answer that cannot disagree with the check it is meant to satisfy. Evaluated,
          # not built — this needs no restore.
          required=$(dotnet msbuild Daqifi.Avalonia.iOS/Daqifi.Avalonia.iOS.csproj \
            -getProperty:_RecommendedXcodeVersion | tr -d '[:space:]')
          if [ -z "${required}" ]; then
            echo "::error::_RecommendedXcodeVersion evaluated empty. The iOS SDK pack" \
                 "either is not installed or has renamed the property; it is defined in" \
                 "packs/Microsoft.iOS.Sdk.*/targets/Microsoft.iOS.Sdk.Versions.props."
            exit 1
          fi
          echo "REQUIRED_XCODE=${required}" >> "$GITHUB_ENV"
          developer=$(python3 .github/scripts/select_xcode.py "${required}")
          sudo xcode-select -s "${developer}"

      # Same rule as the workload step: assert what the toolchain will actually see,
      # rather than trusting that xcode-select did what it was told.
      - name: Verify the selected Xcode
        run: |
          set -euo pipefail
          echo "developer dir: $(xcode-select -p)"
          # Capture ONCE into a variable, then parse the variable. Do not pipe xcodebuild
          # into `head`: head exits after the first line, xcodebuild takes EPIPE on its
          # next write, and rather than dying quietly it raises
          # NSFileHandleOperationException and aborts with 134, which pipefail turns into
          # a failed job. That is a race — it passed twice here before it bit — which
          # makes it the worst kind of bug to leave in a gate other people's PRs depend
          # on. A command substitution drains the pipe fully, so nothing gets EPIPE, and
          # `awk NR == 1` reads to EOF rather than exiting early the way `head` does.
          xcode_version=$(xcodebuild -version)
          echo "${xcode_version}"
          selected=$(printf '%s\n' "${xcode_version}" | awk 'NR == 1 { print $2 }')
          # major.minor on both sides, because that is the only part
          # _ValidateXcodeVersion compares.
          want=$(printf '%s' "${REQUIRED_XCODE}" | cut -d. -f1,2)
          got=$(printf '%s' "${selected}" | cut -d. -f1,2)
          if [ "${got}" != "${want}" ]; then
            echo "::error::Xcode ${selected} is selected but the iOS workload wants" \
                 "${REQUIRED_XCODE}. The build would fail in _ValidateXcodeVersion."
            exit 1
          fi
          echo "Xcode ${selected} matches the workload's ${REQUIRED_XCODE}"

      # No -r here, deliberately, and this is the head with the most to lose by it: an
      # explicit RID restore REWRITES the lock file to hold only that RID (#85,
      # Directory.Build.props), and this project declares two — iossimulator-arm64 and
      # ios-arm64. The RID arrives at BUILD time instead, against the per-RID assets a
      # RID-less restore has already produced for every declared RuntimeIdentifier.
      - name: Restore
        run: dotnet restore Daqifi.Avalonia.iOS/Daqifi.Avalonia.iOS.csproj

      # Same guard as the other two jobs.
      - name: Lock files must be unchanged by restore
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::restore modified a committed lock file — it was not in the state a" \
                 "clean restore produces. Most often this is a lock file committed from a" \
                 "'-r <rid>' build, which prunes the other RIDs. Re-restore without that flag" \
                 "(or force-evaluate) and commit the result."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by restore"

      # Simulator, not device. ios-arm64 needs an Apple signing identity and a
      # provisioning profile, which a hosted runner does not have; iossimulator-arm64
      # compiles the same managed code and runs the same trimmer, which is the coverage
      # this job exists for. The device RID stays covered by restore and by the lock file.
      #
      # --no-restore is load-bearing, not a speed-up: it is what keeps the -r above out
      # of restore, and therefore out of the lock file.
      - name: Build
        run: |
          dotnet build Daqifi.Avalonia.iOS/Daqifi.Avalonia.iOS.csproj \
            -c Release -r iossimulator-arm64 --no-restore

      # A second look, because this is the ONLY job that passes -r at all. The check
      # after restore cannot see a lock file rewritten by the build, and the whole point
      # of the --no-restore above is a claim about the build's effect on that file.
      - name: Lock files must be unchanged by the RID build
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::the -r build rewrote a lock file, which means it restored" \
                 "despite --no-restore. Whatever caused that, do not commit the result:" \
                 "a RID-pruned lock file fails the next run with NU1004."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by the RID build"

      # The icon is the ONLY thing in this head that a green build does not
      # prove. actool is driven from the @(ImageAsset) item group, so an
      # Assets.xcassets that is present on disk but not in that group is simply
      # never compiled — no warning, no error, exit 0, and an app with a blank
      # icon. That is unobservable from Linux, where every other check in this
      # repo runs, which is exactly why it is asserted here.
      #
      # Assets.car is actool's output and only exists if actool ran. Asserting
      # the .app is a real bundle first keeps a rename or an output-path change
      # from being reported as a missing icon.
      - name: iOS app bundle must contain a compiled asset catalogue
        run: |
          set -euo pipefail
          app=$(find Daqifi.Avalonia.iOS/bin/Release -maxdepth 3 -type d -name '*.app' -print -quit)
          if [ -z "${app}" ]; then
            echo "::error::no .app bundle under Daqifi.Avalonia.iOS/bin/Release. The build" \
                 "output moved; this check needs updating, and the icon is unverified."
            exit 1
          fi
          echo "bundle: ${app}"
          if [ ! -f "${app}/Assets.car" ]; then
            echo "::error::${app} has no Assets.car, so actool never compiled" \
                 "Assets.xcassets. The app would install with a blank icon. Check that" \
                 "Assets.xcassets/**/*.png AND **/Contents.json are both <ImageAsset>" \
                 "in Daqifi.Avalonia.iOS.csproj — listing them as <None> causes exactly this."
            ls -la "${app}"
            exit 1
          fi
          echo "Assets.car present ($(wc -c < "${app}/Assets.car") bytes)"
          # Name the icon too: a catalogue can compile while carrying no AppIcon at
          # all, which fails App Store submission rather than the build.
          if ! plutil -p "${app}/Info.plist" | grep -q CFBundleIcon; then
            echo "::error::actool ran but wrote no CFBundleIcon* key into Info.plist," \
                 "so the catalogue contains no AppIcon set. Check XSAppIconAssets in" \
                 "Info.plist names an appiconset that exists."
            exit 1
          fi
          plutil -p "${app}/Info.plist" | grep -A6 CFBundleIcon

      - name: Upload dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: assets-ios
          # Same glob and same reasoning as the other two jobs.
          path: '**/obj/project.assets.json'
          if-no-files-found: error

  avalonia-graph:
    name: Avalonia version lockstep
    runs-on: ubuntu-latest
    # Runs only once every head has resolved, because the check that matters most
    # — the same package resolving to different versions in different heads — is
    # invisible when looking at any single project. iOS is in this list because it pins
    # Avalonia.iOS by hand; a head whose graph nobody uploads is a head this gate does
    # not actually cover.
    needs: [desktop, android, ios]
    steps:
      - uses: actions/checkout@v4

      # One directory PER ARTIFACT (which is what omitting merge-multiple gets you),
      # not all three flattened into one. Every head restores the shared library and
      # the vendored OxyPlot, so all three artifacts contain
      # Daqifi.Avalonia/obj/project.assets.json at the same relative path — merged, they
      # overwrite each other and whichever job's extraction landed last is the only one
      # the gate ever sees. That is the exact failure this check exists to prevent, one
      # level up: a split between two heads in a shared project is invisible if only one
      # head's copy survives. It also makes the paths in a failure message say WHICH head
      # (graphs/assets-ios/... rather than graphs/...).
      - name: Download dependency graphs
        uses: actions/download-artifact@v4
        with:
          path: graphs

      # Run the guard's own tests before trusting its verdict. Its value is entirely in
      # FAILING on a split graph; a guard that silently only ever passes reads as coverage
      # while providing none.
      - name: Self-test the guard
        run: python3 .github/scripts/test_check_avalonia_versions.py

      - name: Check the Avalonia graph
        run: |
          set -euo pipefail
          mapfile -t assets < <(find graphs -name project.assets.json | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No project.assets.json artifacts were downloaded."
            exit 1
          fi
          printf 'checking %s\n' "${assets[@]}"
          python3 .github/scripts/check_avalonia_versions.py "${assets[@]}"
