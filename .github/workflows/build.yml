name: Build

# Compile gate for every head, and the thing that finally makes the committed
# packages.lock.json files load-bearing.
#
# GitHub Actions sets CI=true, which is one of the two conditions on
# RestoreLockedMode in the repo-root Directory.Build.props, so restores here run in
# LOCKED mode: a lock file that has drifted from the project's dependencies fails
# with NU1004 instead of being silently regenerated. Before #71 nothing in this repo
# exercised that, and nothing checked that any head still compiled — the Avalonia 12
# migration surfaced two breaks (androidx.lifecycle.runtime forcing minSdk 23, and
# the capture harness needing Avalonia.HarfBuzz once text shaping was decoupled from
# the renderer) that only a build could have found.
#
# This is also the workflow the merge queue builds. It runs on `merge_group` so that
# its jobs can be listed as required checks on `main` — the queue evaluates required
# checks against the tentative merge of the queued pull requests, not against any PR
# head, which is the whole point: it catches the pair of PRs that each pass alone and
# break together. Setup and the list of checks that are safe to require:
# .github/merge-queue/README.md.
#
# tools/parity-audit/WpfCapture is deliberately absent: it targets net10.0-windows
# and ProjectReferences the SIBLING daqifi-desktop repo, so it cannot restore here at
# all. It is also opted out of the lock-file policy — see its csproj.

on:
  push:
    branches: [main]
  pull_request:
  # Required for the merge queue. A queue entry is built on a synthetic
  # `refs/heads/gh-readonly-queue/main/pr-N-<sha>` ref, and a required check with no
  # `merge_group` trigger never reports on that ref at all — the entry then sits
  # there until the queue's status-check timeout expires and is ejected, which reads
  # as "the merge queue is broken" rather than as a missing trigger. Every job below
  # is safe to run here precisely because none of them touch `github.event.pull_request`,
  # `github.head_ref`, or `github.base_ref`; keep it that way, or gate the new use on
  # `github.event_name`. See .github/merge-queue/README.md.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on a PR branch, but never on main and never in the merge
  # queue. This condition must stay keyed on `pull_request` alone: a cancelled
  # `merge_group` run reports as a FAILED required check, which ejects that pull
  # request from the queue and forces every entry queued behind it to rebuild. The
  # group is safe as-is because `github.ref` is already unique per queue entry, so
  # two queue runs can never collide in the first place.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # The .github/scripts guards are only worth anything if they still work, and two
  # of them are invoked NOWHERE on a normal PR: check_dependabot_claims.py runs
  # only on Dependabot's own pull requests, and check_core_drift.py only on a
  # weekly schedule. A change that broke either would sit undetected until the next
  # Dependabot PR or the next Monday — and both guards exist precisely because
  # nobody was watching. This job runs every self-test on every push and PR, so a
  # broken guard fails here instead of going quiet where it matters.
  #
  # The other two are ALSO invoked in place, next to the step whose verdict they
  # gate. That duplication is deliberate: this job proves the guard works, the
  # in-place run proves it works on the runner that is about to trust it.
  scripts:
    name: CI script self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run every guard's self-test
        run: |
          set -euo pipefail
          mapfile -t tests < <(find .github/scripts -name 'test_*.py' | sort)
          # A silent empty sweep would report success without running anything —
          # the same failure shape the guards themselves are written to avoid.
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::No .github/scripts/test_*.py found — nothing was run."
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "::group::${test}"
            python3 "${test}"
            echo "::endgroup::"
          done

  desktop:
    name: Library + Desktop head + capture harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Resolve the SDK from global.json, NOT a floating '10.0.x'.
      # Microsoft.NET.ILLink.Tasks is an IMPLICIT PackageReference on the trimming heads,
      # pinned to the SDK's BundledNETCoreAppPackageVersion — its bundled runtime. So the
      # SDK patch silently decides a package version that the lock files record, which
      # makes a floating SDK an input to locked mode that nobody controls. '10.0.x'
      # floated across a whole feature band (to 10.0.400, runtime 10.0.11) and broke
      # restore with NU1004 on a repo nobody had touched in 12 days. See #107.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Fail loudly if the locked-mode gate is NOT actually armed. Without this the
      # whole workflow could go green while restores silently ran unlocked — the
      # failure mode that made the lock files decorative in the first place. Checked
      # against a real project so it reflects the inherited Directory.Build.props.
      - name: Verify locked-mode restore is armed
        run: |
          set -euo pipefail
          locked=$(dotnet msbuild Daqifi.Avalonia/Daqifi.Avalonia.csproj \
            -getProperty:RestoreLockedMode)
          echo "RestoreLockedMode=${locked}"
          if [ "${locked}" != "true" ]; then
            echo "::error::RestoreLockedMode is '${locked}', expected 'true'." \
                 "Lock files are not being enforced — the gate is off."
            exit 1
          fi

      # Restored explicitly (rather than implicitly via build) so an NU1004
      # lock-file drift failure is attributed to its own step.
      - name: Restore
        run: |
          dotnet restore Daqifi.Avalonia/Daqifi.Avalonia.csproj
          dotnet restore Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj
          dotnet restore Daqifi.Avalonia.Tests/Daqifi.Avalonia.Tests.csproj
          dotnet restore tools/parity-audit/AvaloniaCapture/AvaloniaCapture.csproj
          dotnet restore tools/system-test/HeadlessBench/HeadlessBench.csproj

      # Locked mode fails a restore whose lock file has DRIFTED, but a lock file can also be
      # committed already-wrong in a way that only surfaces as a confusing error later. The
      # specific trap: an explicit `-r <rid>` restore rewrites the lock to hold only that RID
      # (#85), and committing that yields "NU1004: the project's runtime identifiers have
      # changed" on the next run. Asserting the tree is unchanged after restore catches any such
      # mutation at its source and names the file, instead of leaving the next person to decode a
      # RID-mismatch error.
      - name: Lock files must be unchanged by restore
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::restore modified a committed lock file — it was not in the state a" \
                 "clean restore produces. Most often this is a lock file committed from a" \
                 "'-r <rid>' build, which prunes the other RIDs. Re-restore without -r (or with" \
                 "--force-evaluate) and commit that."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by restore"

      # AvaloniaCapture is compiled here as a gate. It used to pin
      # RuntimeIdentifier=win-x64 and was cross-built on this runner because it could
      # not be RUN here; it is RID-less since #89, so this now builds it for the
      # runner's own platform and it WOULD run.
      #
      # Deliberately still only COMPILED, not run — HERE. Running it would be a
      # stronger gate — it boots the real app and renders 25 screens, which a compile
      # cannot check — and since #191 the macos job does exactly that. This one still
      # does not, because the harness has never been executed on a LINUX runner
      # (headless Skia, font availability), and adding a CI step nobody has watched
      # succeed is how a gate arrives broken. That is its own change, with its own
      # evidence.
      #
      # tools/system-test/HeadlessBench is compiled here for the same reason and with the
      # same limit — COMPILED, never run. It cannot run here at all: it drives a real
      # DAQiFi board over serial, and no runner has one. What a compile buys is the thing
      # the rig was missing while it sat untracked (#254): it reaches deep into the app's
      # internals — DaqifiViewModel, ConnectionDialogViewModel.ConnectManualSerialCommand,
      # LoggingManager.Subscribe, shell.Plotter.LoggedPoints — none of which are public
      # API, and all of which move. #245 and #246 both DELETED view-model members after
      # searching the repo for readers; a rig outside the repo is invisible to that search
      # and would have been broken by it silently. Now it breaks the build instead.
      - name: Build
        run: |
          dotnet build Daqifi.Avalonia/Daqifi.Avalonia.csproj \
            -c Release --no-restore
          dotnet build Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj \
            -c Release --no-restore
          dotnet build tools/parity-audit/AvaloniaCapture/AvaloniaCapture.csproj \
            -c Release --no-restore
          dotnet build tools/system-test/HeadlessBench/HeadlessBench.csproj \
            -c Release --no-restore

      # Runs BEFORE the suite, because it is the one #210 invariant the suite cannot
      # check on itself. The tests assert that TestDatabase hands out unpooled
      # connections; nothing at runtime can notice a NEW fixture that never asks it and
      # quietly re-pools the process. Green tells you nothing here — the flake has been
      # chased for 348 full runs without appearing — so the source is where it is held.
      # Self-tested in the scripts job like every other guard; run in place here, next
      # to the step whose verdict it gates.
      - name: Guard — the unit suite opens no pooled SQLite connection
        run: python3 .github/scripts/check_test_sqlite_pooling.py --glob

      # The unit suite. `dotnet test` builds Daqifi.Avalonia.Tests itself, so this is
      # also that project's compile gate — there is no separate build line for it above.
      #
      # It runs HERE, on ubuntu, and not on the macos job; the note in that job says what
      # would move it.
      #
      # THE EXIT CODE ALONE IS NOT TRUSTED, for the same reason the scripts job counts its
      # self-tests before running them. The characteristic failure of a test project is not
      # a failing test, it is a suite that DISCOVERS NOTHING: drop the runner package, let
      # the adapter stop matching the target framework, or exclude the test file from
      # compilation, and the run reports success having asserted nothing at all. That reads
      # as coverage from the outside and is worse than having no suite, because it is
      # believed. So the TRX counters are read back and a total of zero fails the job.
      - name: Test
        run: |
          set -euo pipefail
          dotnet test Daqifi.Avalonia.Tests/Daqifi.Avalonia.Tests.csproj \
            -c Release --no-restore \
            --logger "trx;LogFileName=results.trx" \
            --results-directory "${RUNNER_TEMP}/testresults"
          python3 - "${RUNNER_TEMP}/testresults/results.trx" <<'PY'
          import sys, xml.etree.ElementTree as ET

          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          counters = ET.parse(sys.argv[1]).getroot().find("t:ResultSummary/t:Counters", ns)
          if counters is None:
              print("::error::the TRX has no ResultSummary/Counters element, so the run "
                    "cannot be verified. The logger or its schema has changed.")
              raise SystemExit(1)
          total = int(counters.get("total", "0"))
          passed = int(counters.get("passed", "0"))
          if total == 0:
              print("::error::the test run discovered ZERO tests and exited 0 because "
                    "there was nothing to fail. Check that xunit.runner.visualstudio is "
                    "still referenced and still targets this framework.")
              raise SystemExit(1)
          print(f"{passed}/{total} tests passed")
          PY

      - name: Upload dependency graphs
        uses: actions/upload-artifact@v4
        with:
          name: assets-desktop
          path: '**/obj/project.assets.json'
          if-no-files-found: error

      # THE CANONICAL COPY OF THIS CHECK — the android and ios jobs run the same thing
      # against their own heads and point back here.
      #
      # Everything above only sees drift that a PLAIN restore reacts to, and a plain
      # restore that finds a CONSISTENT lock file leaves it byte-for-byte alone. NuGet
      # compares ids case-insensitively when deciding that, so a lock file whose entries
      # are merely SPELLED differently from what a fresh derivation produces is
      # "consistent": it satisfies locked mode, survives the check above, and stays stale
      # indefinitely. Nothing in this repo could see that class of difference before.
      #
      # #106 is what it cost. The vendored project's key sat as `Oxyplot.Avalonia` in
      # four of the five lock files that carry it, while a macOS restore derived
      # `oxyplot.avalonia`. So every Mac contributor who ran --force-evaluate — which the
      # error text above tells them to run, and which .github/scripts/refresh_lock_files.sh
      # runs on every project — got a one-line diff out of an untouched tree and had to
      # know to throw it away.
      #
      # The cause was a case-only mismatch between the vendored project's PackageId and
      # its project name, which macOS and Linux resolved differently; removing it is the
      # other half of #106. This check is what proves that stayed fixed: the derivation
      # now runs on BOTH hosts (here and the android job on ubuntu, the ios job on
      # macOS), so a key that is host-dependent again fails on one of them.
      #
      # It runs LAST and does not replace the restore above, because --force-evaluate
      # also overrides RestoreLockedMode — this is a staleness check, not a substitute
      # for the drift gate.
      - name: Lock files must equal a from-scratch derivation
        run: |
          set -euo pipefail
          dotnet restore Daqifi.Avalonia/Daqifi.Avalonia.csproj --force-evaluate
          dotnet restore Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj --force-evaluate
          # Listed in its own right: a --force-evaluate restore walks project references
          # DOWNWARDS, so restoring Daqifi.Avalonia never reaches the test project that
          # references it. Without this line Daqifi.Avalonia.Tests/packages.lock.json is
          # the one lock file in the repo no job derives from scratch.
          dotnet restore Daqifi.Avalonia.Tests/Daqifi.Avalonia.Tests.csproj --force-evaluate
          dotnet restore tools/parity-audit/AvaloniaCapture/AvaloniaCapture.csproj \
            --force-evaluate
          dotnet restore tools/system-test/HeadlessBench/HeadlessBench.csproj \
            --force-evaluate
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::a from-scratch restore derives lock files different from the" \
                 "committed ones. They are stale rather than drifted, which is why every" \
                 "other check passed. Regenerate with .github/scripts/refresh_lock_files.sh" \
                 "and commit the result."
            # The full diff, not --stat. A staleness failure is usually a handful of
            # lines and the CONTENT is the whole diagnosis — a file name alone leaves
            # the reader to re-derive it locally, on a host that may not reproduce it.
            git diff -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files match a from-scratch derivation"

  macos:
    name: Desktop head on macOS
    # #88. macOS was verified once by hand (docs/RUNBOOK-macos-ios.md §1.1, 2026-08-01)
    # and then guarded by nothing, which is how a Windows-shaped path separator —
    # AppDirectory + "\\..." — reached macOS and quietly wrote settings to a file
    # literally NAMED 'DAQiFi\DAQifiConfiguration.xml'. It never threw, and no job in
    # this workflow could have seen it.
    #
    # Be honest about what this job does and does not add over the ubuntu `desktop`
    # job, which already compiles the same sources from the same RID-less restore:
    #
    #   * It builds the Desktop head for an osx-* RID, which nothing did before. A
    #     RID is not a no-op here — it selects a runtime pack, an apphost, and each
    #     package's runtimes/osx-arm64/ assets.
    #   * It asserts those macOS native assets actually landed (see the arm64-natives
    #     step). That is the part a green compile genuinely does not prove.
    #   * It RUNS the visual capture harness, five times, and requires all 25 screens
    #     to be byte-identical across the five (#191, the determinism step at the end
    #     of this job). That is the first thing in this workflow that executes any of
    #     this repo's UI code rather than compiling it.
    #   * It then requires those same captures to match the committed
    #     tools/parity-audit/baselines/macos-arm64.sha256, byte for byte (#188, the
    #     baseline step after it). The manifest is recorded on a developer's Mac, so
    #     this is the check that makes its OS+arch name mean something: a second
    #     Apple-silicon machine, on every pull request, reproducing the same bytes.
    #
    # A green compile does NOT catch the separator bug above, or anything else that is
    # wrong only at runtime. What this job buys is that the macOS target stops being a
    # claim nobody re-checks — and, since #191, that it is also where the runtime
    # checks land, which is what the previous version of this comment said it was
    # waiting for.
    #
    # The job NAME is load-bearing: `Desktop head on macOS` is listed as a required
    # check (.github/merge-queue/README.md), so renaming it to describe the new step
    # would silently stop that check gating anything.
    #
    # Deliberately NOT covered, so the green tick does not imply more than it means:
    #   * osx-x64. The head declares it; nobody builds or ships it. macos-latest is
    #     Apple silicon, and a second RID would double a 10x-billed job for a target
    #     with no users.
    #   * Running the app. The macOS QA list (RUNBOOK §1.2) is a human checklist.
    #   * The unit suite. #88 asked whether this job should run it and the honest
    #     answer then was that no test project existed; one does now, and the ubuntu
    #     `desktop` job runs it. It is deliberately NOT repeated here. Every test in
    #     Daqifi.Avalonia.Tests today is host-independent arithmetic over OxyPlot
    #     DataPoints, so a second run on a 10x-billed runner would assert the same
    #     thing twice and buy nothing. The trigger to move it is concrete rather than
    #     a matter of taste: the first test whose VERDICT can differ by host — a path
    #     separator, a native asset, a culture or filesystem-case assumption — is the
    #     one that belongs here, and #88's separator bug is exactly that shape.
    #   * The WPF side, and therefore parity itself. `tools/parity-audit/WpfCapture`
    #     targets net10.0-windows and hosts the sibling daqifi-desktop app, so the only
    #     half of the parity comparison that exists on this runner is the Avalonia one.
    #     What runs here is a REGRESSION gate over that half — the port against its own
    #     recorded bytes — not the WPF-vs-Avalonia diff the directory is named for.
    #   * A dependency-graph upload for `avalonia-graph`. That gate reads the
    #     `libraries` section, which comes from a RID-LESS restore and so is
    #     byte-identical to the one `desktop` already uploads. Uploading it would add
    #     a 10x job to that gate's critical path in exchange for no new information —
    #     and, because the download step takes every artifact in the run rather than
    #     a named list, an upload without a matching `needs:` entry would be a race.
    #
    # macos-latest, matching the ios job, because this repo pins no macOS image.
    # Unlike that job nothing here depends on which one arrives: the Desktop head is
    # plain net10.0, so there is no workload to install and no Xcode to select.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as every other job — see the comment on the desktop job, and #107.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # No -r, for the reason the ios job gives at length and Directory.Build.props
      # gives at more: an explicit-RID restore REWRITES the lock file to hold only
      # that RID (#85), and this head declares four. The RID arrives at BUILD time
      # instead, against the per-RID assets a RID-less restore has already produced
      # for every declared RuntimeIdentifier.
      #
      # The head alone is enough to restore the app — Daqifi.Avalonia and the vendored
      # OxyPlot.Avalonia arrive as project references.
      #
      # The capture harness is restored EXPLICITLY rather than implicitly by the
      # `dotnet run` inside run.sh, for two reasons. An NU1004 lock-file failure gets
      # attributed to a restore step instead of surfacing as "the visual gate broke";
      # and the guard below then covers this lock file on a macOS derivation host,
      # which nothing did before — #106 was a lock-file key that macOS and Linux
      # derived with different casing, and AvaloniaCapture's lock file is otherwise
      # only ever derived on ubuntu.
      - name: Restore
        run: |
          dotnet restore Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj
          dotnet restore tools/parity-audit/AvaloniaCapture/AvaloniaCapture.csproj

      # Same guard as every other job.
      - name: Lock files must be unchanged by restore
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::restore modified a committed lock file — it was not in the state a" \
                 "clean restore produces. Most often this is a lock file committed from a" \
                 "'-r <rid>' build, which prunes the other RIDs. Re-restore without that flag" \
                 "(or force-evaluate) and commit the result."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by restore"

      # --no-restore is load-bearing, not a speed-up — the same point the ios job
      # makes. It is what keeps the -r above out of restore, and therefore out of the
      # lock file.
      - name: Build
        run: |
          dotnet build Daqifi.Avalonia.Desktop/Daqifi.Avalonia.Desktop.csproj \
            -c Release -r osx-arm64 --no-restore

      # The second look the ios job also takes, and for the same reason: this is one
      # of only two jobs that pass -r at all, the post-restore check cannot see a lock
      # file rewritten by the BUILD, and --no-restore above is precisely a claim about
      # the build's effect on that file.
      - name: Lock files must be unchanged by the RID build
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::the -r build rewrote a lock file, which means it restored" \
                 "despite --no-restore. Whatever caused that, do not commit the result:" \
                 "a RID-pruned lock file fails the next run with NU1004."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by the RID build"

      # Verify the ARTIFACT, not the exit code — the standing rule in
      # docs/RUNBOOK-macos-ios.md, and the same shape as the ios job's Assets.car
      # check. This is the part of the job a green compile does not already cover.
      #
      # Every library below ships inside a NuGet package as a runtimes/osx-arm64/
      # native/ entry, and `-r osx-arm64` is what makes the SDK select that RID's
      # copy and place it next to the binary. If a bump ever dropped or renamed one,
      # the managed compile would still succeed — on ubuntu AND here — and the app
      # would die on first use with a DllNotFoundException that names a file nobody
      # put in a csproj. Each of these is fatal on its own:
      #
      #   libAvaloniaNative          the macOS windowing backend; no window without it
      #   libSkiaSharp               the renderer
      #   libHarfBuzzSharp           text shaping, decoupled from the renderer in
      #                              Avalonia 12 (see this file's header)
      #   libSystem.IO.Ports.Native  serial/USB — the entire point of the app
      #   libe_sqlite3               the logging database
      #
      # Presence alone is not enough for any of them: a package that shipped an
      # x86_64-only binary under runtimes/osx-arm64/ would satisfy an existence test
      # and still not load in an arm64 process. So each one is read for an arm64
      # slice, exactly as the apphost is.
      - name: macOS output must be an arm64 binary carrying its native dependencies
        run: |
          set -euo pipefail
          out=Daqifi.Avalonia.Desktop/bin/Release/net10.0/osx-arm64

          # `file -b`, and only its FIRST line. Neither is tidiness. The output
          # directory is literally named 'osx-arm64' and plain `file` prefixes every
          # line it prints with the path, so the string "arm64" is in that output no
          # matter what the binary actually is:
          #
          #   * For a THIN file the path prefix lands BEFORE the word "Mach-O", so a
          #     *Mach-O*arm64* test still rejects an x86_64 binary — by luck of
          #     ordering, not by design.
          #   * For a UNIVERSAL file `file` appends one line per architecture, each
          #     repeating the path AFTER that header. Now the pattern matches the
          #     DIRECTORY NAME rather than the architecture list, and an x86_64+i386
          #     fat binary would sail through. Three of the five libraries below are
          #     universal today, so that is not the corner case; it is the usual one.
          #
          # -b drops the prefix from the header line, and the header alone names every
          # architecture in a fat file ("...2 architectures: [x86_64:...] [arm64]") —
          # sufficient, and free of the path. A universal binary passing is correct
          # rather than a loophole: an arm64 slice is an arm64 slice.
          #
          # awk 'NR == 1' rather than `head -1`: head exits immediately, file takes
          # EPIPE on its next write and aborts with 134, which pipefail turns into a
          # failed job. The ios job hit that exact race with xcodebuild; awk reads to
          # EOF and drains the pipe.
          arch_of() {
            file -b "$1" | awk 'NR == 1'
          }

          host="${out}/Daqifi.Avalonia.Desktop"
          if [ ! -x "${host}" ]; then
            echo "::error::no executable at ${host}. The build output moved; this check" \
                 "needs updating, and the macOS binary is unverified."
            ls -la "${out}" || ls -la Daqifi.Avalonia.Desktop/bin/Release || true
            exit 1
          fi
          host_kind=$(arch_of "${host}")
          echo "apphost: ${host_kind}"
          # Both substrings: a non-Mach-O file and an x86_64 one each fail to match.
          case "${host_kind}" in
            *Mach-O*arm64*) ;;
            *)
              echo "::error::${host} is not an arm64 Mach-O binary: ${host_kind}." \
                   "The -r osx-arm64 build did not produce an Apple-silicon apphost."
              exit 1
              ;;
          esac

          bad=0
          for lib in libAvaloniaNative libSkiaSharp libHarfBuzzSharp \
                     libSystem.IO.Ports.Native libe_sqlite3; do
            path="${out}/${lib}.dylib"
            if [ ! -f "${path}" ]; then
              echo "::error::${lib}.dylib is missing from ${out}. The osx-arm64 runtime" \
                   "asset for it did not resolve, so the app would fail at startup with" \
                   "a DllNotFoundException. Check whether the package that ships it still" \
                   "carries a runtimes/osx-arm64/native/ entry."
              bad=1
              continue
            fi
            lib_kind=$(arch_of "${path}")
            echo "${lib}.dylib: ${lib_kind}"
            case "${lib_kind}" in
              *Mach-O*arm64*) ;;
              *)
                echo "::error::${path} has no arm64 slice: ${lib_kind}. The file is" \
                     "there but cannot load in an arm64 process, so the app fails at" \
                     "startup anyway. A universal binary is fine; an x86_64-only one" \
                     "under runtimes/osx-arm64/ is a packaging regression upstream."
                bad=1
                ;;
            esac
          done
          if [ "${bad}" -ne 0 ]; then
            ls -la "${out}"
            exit 1
          fi
          echo "arm64 apphost and all five macOS natives present, each with an arm64 slice"

      # ---- The visual gate's determinism half (#191) ----
      #
      # The first step in this workflow that RUNS this repo's UI code instead of
      # compiling it. It boots the real Daqifi.Avalonia app headless five times over
      # and requires every PNG to be byte-identical to the first run's.
      #
      # What it catches, and nothing else did: a harness that races its own animations
      # produces differences indistinguishable from a real regression, and this
      # project has been burned by that twice — a 65.6% "visual regression" that was
      # an unfinished fade-in, and the two live settle-loop races #179 found by
      # running exactly this mode on macOS (a pane saved mid-fade, ~1 run in 8; the
      # shared SplitView reopened mid-close, a 6-pixel edge flip, 50/50). Both are
      # fixed, and until now nothing stopped the next one landing.
      #
      # Five runs is the harness default and the sample size is arithmetic rather than
      # taste: two runs miss a 50/50 per-run flip half the time, five miss it ~6% of
      # the time. DETERMINISM_RUNS raises it when someone is chasing a flake.
      #
      # This step asserts NOTHING about cross-machine reproducibility: it compares this
      # runner against itself. That is deliberate, and it is also why it has to come
      # first — the baseline step below is the one that compares this runner against
      # another machine's bytes, and it is only meaningful once the capture here is
      # known to be stable. See the job header, and #188.
      #
      # `bash tools/parity-audit/run.sh`, not `./run.sh`: the script is committed mode
      # 644, so invoking it through its exec bit would fail on a fresh checkout. It
      # needs bash specifically (arrays, `shopt`), not sh.
      #
      # No RID anywhere in here, and none needed: run.sh restores implicitly through
      # `dotnet run`, a RID-less restore cannot prune a lock file the way #85's `-r`
      # one did, and the harness was restored explicitly above anyway.
      - name: Visual capture harness must be deterministic
        id: determinism
        env:
          # Under RUNNER_TEMP rather than the workspace: each pass writes a throwaway
          # DAQIFI_DATA_DIR and ~3.5 MB of PNGs, and none of that should be anywhere a
          # later `git diff` check can see it.
          #
          # This path is spelled out in THREE places in this job — here, the collect
          # step below, and the upload's `path:` — and they must stay in step. It
          # cannot be hoisted to a job-level `env:`, because the `runner` context is
          # not available there; only steps can read `runner.temp`.
          PARITY_OUT: ${{ runner.temp }}/parity-audit
        run: |
          set -euo pipefail
          bash tools/parity-audit/run.sh --determinism "${PARITY_OUT}"

          # ASSERT THE SIZE OF THE CAPTURE SET, which the byte comparison above cannot:
          # it compares whatever BOTH runs contain, so a consistently absent screen
          # reads as a clean "17/17 byte-identical" rather than as an incomplete
          # capture. #179 put a guard for that inside the harness (ExpectedScreens) and
          # this is deliberately a SECOND, independent statement of the same contract,
          # because the harness's list is a variable that a change can edit downwards:
          # if the only record of the expected count sits beside the code that
          # produces it, a gate that shrinks stays green. A gate that quietly shrinks
          # its own scope is worse than no gate, because it is believed.
          #
          # Counting r1 alone is sufficient. run.sh compares every later run against r1
          # in BOTH directions, so a run whose set of names differs has already failed.
          #
          # Adding a screen therefore means editing two places on purpose: the
          # harness's ExpectedScreens, and this number.
          #
          # 18 desktop/mobile screens + 7 dialog screens (#213, plus the firmware
          # upload scrim added for #241).
          expected=25
          actual=$(find "${PARITY_OUT}/determinism/r1" -maxdepth 1 -type f -name '*.png' \
                     | wc -l | tr -d '[:space:]')
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the capture produced ${actual} screens, not ${expected}." \
                 "Every run agreed with every other, so this is NOT a determinism" \
                 "failure — it is an incomplete capture that passed the comparison by" \
                 "being incomplete in the same way twice. Either a capture site" \
                 "stopped firing, or the screen set changed on purpose and both this" \
                 "number and AvaloniaCapture's ExpectedScreens need updating in the" \
                 "same commit."
            ls -la "${PARITY_OUT}/determinism/r1"
            exit 1
          fi
          echo "${actual} screens, byte-identical across every run"

      # ---- The visual gate's baseline half (#188) ----
      #
      # The step above proves this runner agrees with ITSELF. This one proves it agrees
      # with the bytes committed in tools/parity-audit/baselines/macos-arm64.sha256,
      # which were recorded on a developer's Mac. That is the claim the manifest's name
      # has been making since #179 and that nothing had ever measured: a file keyed on
      # OS+arch asserts any osx-arm64 host reproduces it, and it had only ever been
      # reproduced on the one machine that produced it.
      #
      # It is measurable now because of two changes that landed on 2026-09-02. #199 put
      # the harness on macos-latest at all, and #202 fixed the reason its output was not
      # a function of the visual tree (Encode read the persistent headless framebuffer,
      # so the bytes depended on the redraw history). Before #202 this step could not
      # have been added: ~1 capture run in 5 on this runner carried a six-pixel flip on
      # the SplitView pane edge, which is exactly the false positive #89 exists to stop.
      #
      # Deliberately NOT a sixth capture. It verifies `determinism/r1`, one of the sets
      # the step above just proved every other run byte-matched — so the verdict is
      # "these five runs agreed with each other AND with the committed baseline" about
      # ONE set of bytes, rather than about a further capture nothing has vouched for.
      # It also costs nothing: capturing is the expensive part and it already happened.
      #
      # The ordering is load-bearing, not just convenient. A baseline check on a host
      # whose captures race is a machine for manufacturing differences that are not
      # regressions; running it after --determinism means five runs have just agreed on
      # these exact bytes, which makes a red tick here far likelier to be a real
      # difference than a flake.
      #
      # Likelier, not certain, and the distinction is this workflow's own: five runs miss
      # a 50/50 per-run flip about 6% of the time (the sample-size note on the step
      # above). So a red tick that does not reproduce is not a nuisance to be re-run
      # past — it is a fourth settle-loop race, which is exactly what #179 and #201 each
      # turned out to be, and it deserves its own ticket rather than a retry.
      #
      # WHEN THIS GOES RED, the fix is never to delete the step. In order of likelihood:
      # a UI change whose PR did not re-record the manifest in the same commit; a real
      # visual regression; or the macos-latest image moving under us. The third is the
      # one a developer's own Mac cannot reproduce, which is why the runner's OS build
      # and image version are printed on every run, green ones included — a mismatch is
      # diagnosed by comparing the host that failed against the hosts that passed, and
      # that comparison needs both sides on record.
      - name: Committed baseline must be reproduced on this runner
        id: baseline
        env:
          PARITY_OUT: ${{ runner.temp }}/parity-audit
        run: |
          set -euo pipefail

          # The second machine, named. ImageOS/ImageVersion are set by the runner image
          # itself, so they say which macos-latest this was even after the label moves.
          echo "host: $(sw_vers -productName) $(sw_vers -productVersion)" \
               "($(sw_vers -buildVersion)), $(uname -m)," \
               "runner image ${ImageOS:-unknown}/${ImageVersion:-unknown}"

          if ! bash tools/parity-audit/run.sh --check-captured "${PARITY_OUT}/determinism/r1"; then
            echo "::error::this runner's capture does not match the committed" \
                 "tools/parity-audit/baselines/macos-arm64.sha256. Five runs agreed on" \
                 "these bytes moments ago, so a real difference is the likeliest reading:" \
                 "the UI changed and the manifest was not re-recorded in the same commit," \
                 "or it is a visual regression, or this runner image no longer renders" \
                 "what the recording host does (compare the host line above against a" \
                 "green run's, and see #188). If instead it does not reproduce, that is a" \
                 "capture race surviving five samples and wants its own ticket, not a" \
                 "re-run. The PNGs are in the parity-determinism-macos artifact."
            exit 1
          fi

      # The capture logs, so the artifact is never empty when it matters most.
      #
      # run.sh's run_capture() sends each pass's whole stdout+stderr to
      # `<out>/.capture-determinism-N.log`, and its failure line points straight at it
      # ("!! determinism-3 failed (see …)"). Two things put those logs out of reach of
      # the upload below, and both had to be true for the artifact to be right:
      #
      #   1. They are written at the OUTPUT ROOT — one level ABOVE `<out>/determinism`,
      #      which is the only directory the upload collects. Nothing under `path:`
      #      ever matched them, so `include-hidden-files` alone would not have helped.
      #   2. They are dotfiles, which upload-artifact drops by default.
      #
      # The case that suffers is exactly the one with the least to go on: a pass that
      # dies BEFORE writing a single PNG — a crash during boot, or a build error out of
      # `dotnet run` — leaves `<out>/determinism/rN` empty, so the upload found no
      # files, `if-no-files-found: warn` shrugged, and NO artifact was produced at all.
      # #191 asked for this gate on the grounds that a determinism failure is only
      # actionable with the differing PNGs in hand; a failure with no PNGs is only
      # actionable with the log, and that was the one thing being thrown away. It is
      # #179's cleanup-destroys-the-evidence trap wearing different clothes.
      #
      # COPIED to a non-hidden name rather than added to `path:`. Adding the glob would
      # force `include-hidden-files: true`, and that flag is not selective: it would
      # also sweep in each run's throwaway `.appdata` (SQLite DB + app logs) — one per
      # run — from inside the very tree being uploaded. Copying keeps that default
      # exclusion doing its job, and puts the evidence somewhere a plain `ls` on the
      # unzipped artifact will show, which is the same dotfile trap
      # tools/parity-audit/README.md already warns readers about.
      #
      # The leading dot is the only thing dropped, so `capture-determinism-3.log` here
      # is the `.capture-determinism-3.log` the failing step named on screen.
      - name: Collect the capture logs
        # Either capture check failing wants the same evidence, and the baseline step
        # verifies determinism/r1 — one of the very sets this collects — so the two
        # share one artifact rather than growing a second, near-identical upload path.
        if: ${{ failure() && (steps.determinism.outcome == 'failure' || steps.baseline.outcome == 'failure') }}
        env:
          PARITY_OUT: ${{ runner.temp }}/parity-audit
        run: |
          set -euo pipefail
          dest="${PARITY_OUT}/determinism/capture-logs"
          mkdir -p "${dest}"
          found=0
          for log in "${PARITY_OUT}"/.capture-determinism-*.log; do
            # An unmatched glob stays literal; skip it rather than copying a filename
            # that does not exist.
            [ -e "${log}" ] || continue
            name="$(basename "${log}")"
            cp "${log}" "${dest}/${name#.}"
            found=$((found + 1))
          done

          # This step is the one place that knows run.sh's log naming, so a rename
          # there must not quietly produce a plausible-looking artifact with the logs
          # missing — that is the failure mode this whole step exists to end. Say so,
          # and say so INSIDE the artifact too, where whoever downloads it is looking.
          if [ "${found}" -eq 0 ]; then
            echo "::warning::no .capture-determinism-*.log found under ${PARITY_OUT}." \
                 "run_capture()'s log naming in tools/parity-audit/run.sh has moved and" \
                 "this step needs updating; the artifact carries the PNGs only."
            printf '%s\n' \
              "No capture logs were collected." \
              "" \
              "This step looked for .capture-determinism-*.log at the parity-audit output" \
              "root, which is where run_capture() in tools/parity-audit/run.sh writes each" \
              "pass's stdout+stderr. Nothing matched. If that naming changed, update the" \
              "'Collect the capture logs' step in .github/workflows/build.yml." \
              > "${dest}/NO-CAPTURE-LOGS.txt"
          fi
          echo "collected ${found} capture log(s) into ${dest}"

      # The PNGs and those logs, on failure only. A determinism failure names the
      # screens that differed and is close to unactionable without the two encodings in
      # hand — and #179 already had to fix a cleanup that destroyed the very evidence
      # its own failure message told you to go and fetch. Not a thing to leave for
      # later. A baseline failure (#188) needs the same PNGs for the same reason: the
      # message names the screens, and the bytes are the only thing that can say what
      # moved. The name still fits — this is `determinism/`, r1..rN, in both cases.
      #
      # Conditioned on THOSE steps rather than a bare `failure()`. `failure()` is
      # required — an `if:` with no status function has an implicit `success()` and
      # would never run here — but on its own it would also fire after an earlier
      # failure (restore, the arm64 check), uploading nothing and adding a second,
      # misleading red step to a job that already said what was wrong.
      #
      # if-no-files-found: warn, and it should now be unreachable: the collect step
      # above writes into this tree unconditionally, so there is always at least a
      # note. It stays `warn` rather than `error` for the reason above — the only way
      # to arrive here empty is the collect step having failed first, and a second red
      # step would restate a diagnosis already on screen.
      #
      # Hidden files are still excluded by upload-artifact's own default, which is what
      # keeps each run's throwaway .appdata (SQLite DB + logs) out of the artifact.
      - name: Upload the determinism captures
        if: ${{ failure() && (steps.determinism.outcome == 'failure' || steps.baseline.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-determinism-macos
          path: ${{ runner.temp }}/parity-audit/determinism
          if-no-files-found: warn

  android:
    name: Android head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as the desktop job — see the comment there, and #107. This job is where
      # the drift actually bit: the Android head trims, so it carries the implicit
      # Microsoft.NET.ILLink.Tasks reference whose version the SDK's bundled runtime picks.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Not preinstalled with the SDK; the Android SDK itself ships on the runner
      # image and is pointed at by ANDROID_HOME.
      - name: Install the android workload
        run: dotnet workload install android

      # ANDROID_HOME comes from the runner image, not from anything this repo controls, so
      # assert it before use. Unset or stale, the restore instead fails deep in the Android
      # targets with an XA5300-style "SDK not found" message that reads like a project
      # problem rather than an environment one.
      - name: Verify the Android SDK is present
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on this runner image."
            exit 1
          fi
          if [ ! -d "${ANDROID_HOME}/platforms" ]; then
            echo "::error::ANDROID_HOME='${ANDROID_HOME}' has no platforms/ directory;" \
                 "it does not look like an Android SDK."
            exit 1
          fi
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Restore
        run: |
          dotnet restore Daqifi.Avalonia.Android/Daqifi.Avalonia.Android.csproj \
            -p:AndroidSdkDirectory="$ANDROID_HOME"

      # Same guard as the desktop job — the Android head restores its own graph and can
      # mutate its own lock file, so checking only one job would leave half the repo
      # unguarded.
      - name: Lock files must be unchanged by restore
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::restore modified a committed lock file — it was not in the state a" \
                 "clean restore produces. Most often this is a lock file committed from a" \
                 "'-r <rid>' build, which prunes the other RIDs. Re-restore without that flag" \
                 "(or force-evaluate) and commit the result."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by restore"

      - name: Build
        run: |
          dotnet build Daqifi.Avalonia.Android/Daqifi.Avalonia.Android.csproj \
            -c Release --no-restore -p:AndroidSdkDirectory="$ANDROID_HOME"

      - name: Upload dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: assets-android
          # Same glob as the desktop job, not the single concrete path: for one
          # file upload-artifact strips the tree to its least common ancestor, so
          # the concrete path would arrive as a bare project.assets.json with no
          # project to attribute a failure to.
          path: '**/obj/project.assets.json'
          if-no-files-found: error

      # Same staleness check as the desktop job, which carries the reasoning. It has to
      # be repeated per head: a ProjectReference restore reaches the vendored OxyPlot
      # from the shared library, but it never reaches the Android head, so this lock
      # file is not covered by any other job's re-derivation.
      - name: Lock files must equal a from-scratch derivation
        run: |
          set -euo pipefail
          dotnet restore Daqifi.Avalonia.Android/Daqifi.Avalonia.Android.csproj \
            --force-evaluate -p:AndroidSdkDirectory="$ANDROID_HOME"
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::a from-scratch restore derives lock files different from the" \
                 "committed ones. They are stale rather than drifted, which is why every" \
                 "other check passed. Regenerate with .github/scripts/refresh_lock_files.sh" \
                 "and commit the result."
            git diff -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files match a from-scratch derivation"

  ios:
    name: iOS head
    # The only job here that is not ubuntu, and it has no choice: iOS cannot
    # cross-compile from Linux. Until this existed the iOS head was in
    # Daqifi.Avalonia.slnx and in nobody's build — a change that broke it landed green
    # (#105).
    #
    # This repo is private, so macOS minutes bill at 10x Linux. That is the cost of the
    # job and it is deliberate: the alternative on offer was a path filter, and a gate
    # that only runs when someone remembers to touch the right directory is not a gate.
    # If the bill ever argues otherwise, narrow it on evidence, not on the assumption
    # that shared-library changes cannot break a platform head — that assumption is
    # exactly what #88 records going wrong on macOS.
    #
    # 'latest' rather than a pinned image, unlike everything else in this repo, because
    # the thing that actually has to line up is the image's Xcode MAJOR against the one
    # the pinned SDK's workload wants, and a stale pin does not help with that — an
    # image carries only one Xcode major. When the label moves and the majors diverge,
    # the Xcode step below says so by name instead of failing 200 lines into a build.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as the other two jobs — see the comment on the desktop job, and #107.
      # It matters more here than anywhere: the SDK band also decides which iOS workload
      # is installed below, and therefore which Xcode this job has to select.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Mirrors the android job's workload step. Not preinstalled with the SDK, and
      # setup-dotnet installs into its own prefix, so whatever the runner image ships
      # under /usr/local/share/dotnet is not what runs here.
      - name: Install the iOS workload
        run: |
          set -euo pipefail
          dotnet workload install ios 2>&1 | tee "${RUNNER_TEMP}/workload-install.log"
          # This command has been seen to print a permissions error and STILL EXIT 0
          # (docs/RUNBOOK-macos-ios.md §0, caught on a real Mac). The build then fails
          # much later with something that reads like a project problem. Name it here.
          if grep -qi 'inadequate permissions' "${RUNNER_TEMP}/workload-install.log"; then
            echo "::error::'dotnet workload install ios' reported inadequate permissions" \
                 "and exited 0 anyway. The workload is NOT installed. dotnet lives at" \
                 "$(command -v dotnet) on this runner; if that prefix is root-owned the" \
                 "install needs elevation."
            exit 1
          fi

      # Verify the ARTIFACT, not the exit code — the standing rule in
      # docs/RUNBOOK-macos-ios.md, and the specific trap the step above exists for. The
      # android job asserts its SDK is present the same way before using it.
      - name: Verify the iOS workload is installed
        run: |
          set -euo pipefail
          dotnet workload list
          if ! dotnet workload list | awk '$1 == "ios" { found = 1 } END { exit !found }'; then
            echo "::error::'dotnet workload list' does not list 'ios'. The workload" \
                 "install did not take, whatever it exited with."
            exit 1
          fi
          echo "iOS workload present"

      # Run the selector's own tests before trusting it, exactly as avalonia-graph does
      # with its guard. Its value is in REFUSING when the image has no matching Xcode;
      # a selector that only ever succeeds would silently pick the wrong one.
      - name: Self-test the Xcode selector
        run: python3 .github/scripts/test_select_xcode.py

      # #103. .NET for iOS compares the host Xcode for EXACT major.minor equality, so a
      # newer Xcode fails just like an older one and upgrading is not a fix. The two ways
      # out are -p:ValidateXcodeVersion=false, which switches off a real compatibility
      # gate inside the job whose whole purpose is to be one, or selecting the Xcode the
      # workload asks for. The macOS image carries every minor of its Xcode major
      # (26.0.1 … 26.6 today), so the second is a one-line xcode-select.
      #
      # The version is READ FROM THE SDK, never written here, because it tracks the SDK
      # pin and tracks nothing else you could infer it from. Under 10.0.203 the answer was
      # Xcode 26.4; under the pinned 10.0.302 the iOS workload manifest is 26.5.10315 and
      # the Xcode it asks for is 26.6. Those two disagree on purpose — the manifest's 26.5
      # is an iOS version, and the lock file's net10.0-ios26.5 framework is that same
      # number, not an Xcode one. So every literal that looked plausible while writing
      # this (#103's 26.4, the manifest's 26.5, the lock file's 26.5) is wrong. Ask the
      # SDK; it is the only thing that knows.
      - name: Pin Xcode to the version the iOS workload requires
        run: |
          set -euo pipefail
          # _RecommendedXcodeVersion is SDK-internal (hence the underscore) but it is the
          # property _ValidateXcodeVersion itself compares against, so it is the only
          # answer that cannot disagree with the check it is meant to satisfy. Evaluated,
          # not built — this needs no restore.
          required=$(dotnet msbuild Daqifi.Avalonia.iOS/Daqifi.Avalonia.iOS.csproj \
            -getProperty:_RecommendedXcodeVersion | tr -d '[:space:]')
          if [ -z "${required}" ]; then
            echo "::error::_RecommendedXcodeVersion evaluated empty. The iOS SDK pack" \
                 "either is not installed or has renamed the property; it is defined in" \
                 "packs/Microsoft.iOS.Sdk.*/targets/Microsoft.iOS.Sdk.Versions.props."
            exit 1
          fi
          echo "REQUIRED_XCODE=${required}" >> "$GITHUB_ENV"
          developer=$(python3 .github/scripts/select_xcode.py "${required}")
          sudo xcode-select -s "${developer}"

      # Same rule as the workload step: assert what the toolchain will actually see,
      # rather than trusting that xcode-select did what it was told.
      - name: Verify the selected Xcode
        run: |
          set -euo pipefail
          echo "developer dir: $(xcode-select -p)"
          # Capture ONCE into a variable, then parse the variable. Do not pipe xcodebuild
          # into `head`: head exits after the first line, xcodebuild takes EPIPE on its
          # next write, and rather than dying quietly it raises
          # NSFileHandleOperationException and aborts with 134, which pipefail turns into
          # a failed job. That is a race — it passed twice here before it bit — which
          # makes it the worst kind of bug to leave in a gate other people's PRs depend
          # on. A command substitution drains the pipe fully, so nothing gets EPIPE, and
          # `awk NR == 1` reads to EOF rather than exiting early the way `head` does.
          xcode_version=$(xcodebuild -version)
          echo "${xcode_version}"
          selected=$(printf '%s\n' "${xcode_version}" | awk 'NR == 1 { print $2 }')
          # major.minor on both sides, because that is the only part
          # _ValidateXcodeVersion compares.
          want=$(printf '%s' "${REQUIRED_XCODE}" | cut -d. -f1,2)
          got=$(printf '%s' "${selected}" | cut -d. -f1,2)
          if [ "${got}" != "${want}" ]; then
            echo "::error::Xcode ${selected} is selected but the iOS workload wants" \
                 "${REQUIRED_XCODE}. The build would fail in _ValidateXcodeVersion."
            exit 1
          fi
          echo "Xcode ${selected} matches the workload's ${REQUIRED_XCODE}"

      # No -r here, deliberately, and this is the head with the most to lose by it: an
      # explicit RID restore REWRITES the lock file to hold only that RID (#85,
      # Directory.Build.props), and this project declares two — iossimulator-arm64 and
      # ios-arm64. The RID arrives at BUILD time instead, against the per-RID assets a
      # RID-less restore has already produced for every declared RuntimeIdentifier.
      - name: Restore
        run: dotnet restore Daqifi.Avalonia.iOS/Daqifi.Avalonia.iOS.csproj

      # Same guard as the other two jobs.
      - name: Lock files must be unchanged by restore
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::restore modified a committed lock file — it was not in the state a" \
                 "clean restore produces. Most often this is a lock file committed from a" \
                 "'-r <rid>' build, which prunes the other RIDs. Re-restore without that flag" \
                 "(or force-evaluate) and commit the result."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by restore"

      # Simulator, not device. ios-arm64 needs an Apple signing identity and a
      # provisioning profile, which a hosted runner does not have; iossimulator-arm64
      # compiles the same managed code, which is the coverage this job exists for. The
      # device RID stays covered by restore and by the lock file.
      #
      # It no longer runs the same TRIMMER, and that is a real gap rather than a
      # detail: the head sets MtouchInterpreter as a project property, and
      # Xamarin.Shared.Sdk.Trimming.props answers that with _LinkMode=None on the
      # SIMULATOR only (device stays SdkOnly). So the shipping configuration is
      # trimmed and nothing in CI trims. It used to, by accident — UseInterpreter is
      # translated to MtouchInterpreter too late for that file to see it. Getting it
      # back is <MtouchLink>SdkOnly</MtouchLink> in the head plus ~1,240 IL2xxx
      # warnings; see docs/RUNBOOK-macos-ios.md, and #102.
      #
      # --no-restore is load-bearing, not a speed-up: it is what keeps the -r above out
      # of restore, and therefore out of the lock file.
      - name: Build
        run: |
          dotnet build Daqifi.Avalonia.iOS/Daqifi.Avalonia.iOS.csproj \
            -c Release -r iossimulator-arm64 --no-restore

      # A second look, because this is the ONLY job that passes -r at all. The check
      # after restore cannot see a lock file rewritten by the build, and the whole point
      # of the --no-restore above is a claim about the build's effect on that file.
      - name: Lock files must be unchanged by the RID build
        run: |
          set -euo pipefail
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::the -r build rewrote a lock file, which means it restored" \
                 "despite --no-restore. Whatever caused that, do not commit the result:" \
                 "a RID-pruned lock file fails the next run with NU1004."
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files unchanged by the RID build"

      # The icon is the ONLY thing in this head that a green build does not
      # prove. actool is driven from the @(ImageAsset) item group, so an
      # Assets.xcassets that is present on disk but not in that group is simply
      # never compiled — no warning, no error, exit 0, and an app with a blank
      # icon. That is unobservable from Linux, where every other check in this
      # repo runs, which is exactly why it is asserted here.
      #
      # Assets.car is actool's output and only exists if actool ran. Asserting
      # the .app is a real bundle first keeps a rename or an output-path change
      # from being reported as a missing icon.
      - name: iOS app bundle must contain a compiled asset catalogue
        run: |
          set -euo pipefail
          app=$(find Daqifi.Avalonia.iOS/bin/Release -maxdepth 3 -type d -name '*.app' -print -quit)
          if [ -z "${app}" ]; then
            echo "::error::no .app bundle under Daqifi.Avalonia.iOS/bin/Release. The build" \
                 "output moved; this check needs updating, and the icon is unverified."
            exit 1
          fi
          echo "bundle: ${app}"
          if [ ! -f "${app}/Assets.car" ]; then
            echo "::error::${app} has no Assets.car, so actool never compiled" \
                 "Assets.xcassets. The app would install with a blank icon. Check that" \
                 "Assets.xcassets/**/*.png AND **/Contents.json are both <ImageAsset>" \
                 "in Daqifi.Avalonia.iOS.csproj — listing them as <None> causes exactly this."
            ls -la "${app}"
            exit 1
          fi
          echo "Assets.car present ($(wc -c < "${app}/Assets.car") bytes)"
          # Name the icon too: a catalogue can compile while carrying no AppIcon at
          # all, which fails App Store submission rather than the build.
          if ! plutil -p "${app}/Info.plist" | grep -q CFBundleIcon; then
            echo "::error::actool ran but wrote no CFBundleIcon* key into Info.plist," \
                 "so the catalogue contains no AppIcon set. Check XSAppIconAssets in" \
                 "Info.plist names an appiconset that exists."
            exit 1
          fi
          plutil -p "${app}/Info.plist" | grep -A6 CFBundleIcon

      - name: Upload dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: assets-ios
          # Same glob and same reasoning as the other two jobs.
          path: '**/obj/project.assets.json'
          if-no-files-found: error

      # Same staleness check as the desktop job, which carries the reasoning — and this
      # is the copy that runs on macOS. Restoring this head walks its ProjectReference
      # into the shared library, so Daqifi.Avalonia/packages.lock.json — the file that
      # actually carries the vendored project's key — gets re-derived here AND on ubuntu
      # by the desktop job. That pair is the cross-host comparison. #106 was a key that
      # differed between the two host families; without a macOS copy of this check, it
      # could come back with only ubuntu watching.
      #
      # No -r, for the same reason the Restore step above has none: an explicit RID
      # restore prunes the lock file to that one RID.
      - name: Lock files must equal a from-scratch derivation
        run: |
          set -euo pipefail
          dotnet restore Daqifi.Avalonia.iOS/Daqifi.Avalonia.iOS.csproj --force-evaluate
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::a from-scratch restore derives lock files different from the" \
                 "committed ones. They are stale rather than drifted, which is why every" \
                 "other check passed. Regenerate with .github/scripts/refresh_lock_files.sh" \
                 "and commit the result."
            git diff -- '**/packages.lock.json'
            exit 1
          fi
          echo "lock files match a from-scratch derivation"

  avalonia-graph:
    name: Avalonia version lockstep
    runs-on: ubuntu-latest
    # Runs only once every head has resolved, because the check that matters most
    # — the same package resolving to different versions in different heads — is
    # invisible when looking at any single project. iOS is in this list because it pins
    # Avalonia.iOS by hand; a head whose graph nobody uploads is a head this gate does
    # not actually cover.
    needs: [desktop, android, ios]
    steps:
      - uses: actions/checkout@v4

      # One directory PER ARTIFACT (which is what omitting merge-multiple gets you),
      # not all three flattened into one. Every head restores the shared library and
      # the vendored OxyPlot, so all three artifacts contain
      # Daqifi.Avalonia/obj/project.assets.json at the same relative path — merged, they
      # overwrite each other and whichever job's extraction landed last is the only one
      # the gate ever sees. That is the exact failure this check exists to prevent, one
      # level up: a split between two heads in a shared project is invisible if only one
      # head's copy survives. It also makes the paths in a failure message say WHICH head
      # (graphs/assets-ios/... rather than graphs/...).
      - name: Download dependency graphs
        uses: actions/download-artifact@v4
        with:
          path: graphs

      # Run the guard's own tests before trusting its verdict. Its value is entirely in
      # FAILING on a split graph; a guard that silently only ever passes reads as coverage
      # while providing none.
      - name: Self-test the guard
        run: python3 .github/scripts/test_check_avalonia_versions.py

      - name: Check the Avalonia graph
        run: |
          set -euo pipefail
          mapfile -t assets < <(find graphs -name project.assets.json | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No project.assets.json artifacts were downloaded."
            exit 1
          fi
          printf 'checking %s\n' "${assets[@]}"
          python3 .github/scripts/check_avalonia_versions.py "${assets[@]}"
